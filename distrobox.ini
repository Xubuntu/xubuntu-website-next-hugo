# Ubuntu 24.04 container with the Hugo extended release used by CI
# (.github/workflows/hugo.yml), so local builds match production.
# Keep the Hugo version below in sync with HUGO_VERSION in the workflow.
[xubuntu-org]
image=ubuntu:24.04
additional_packages="git ca-certificates curl"
init_hooks=hugo version 2>/dev/null | grep -q v0.128.0- || { curl -fsSL -o /tmp/hugo.deb https://github.com/gohugoio/hugo/releases/download/v0.128.0/hugo_extended_0.128.0_linux-amd64.deb && dpkg -i /tmp/hugo.deb && rm -f /tmp/hugo.deb; }
init=false
nvidia=false
pull=true
root=false
replace=false
start_now=false
